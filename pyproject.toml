[project]
name = "jobradar"
version = "0.1.0"
description = "Job market skills radar — measures global and Kenyan tech skill demand to inform Zindua School's curriculum"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "protego>=0.3",
    "lxml>=5.2",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "tenacity>=8.3",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.5",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.scripts]
jobradar = "jobradar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "RUF"]
ignore = [
    # Blind excepts are deliberate in the fetch layer: a robots.txt that cannot
    # be retrieved for ANY reason must fail open, and any network-level
    # exception must be retried rather than crashing a long crawl.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures use fixed naive datetimes for readability; they never cross a
# timezone boundary.
"tests/*" = [
    "DTZ001",   # fixed naive datetimes in fixtures never cross a tz boundary
    "RUF059",   # tuple unpacking in test helpers reads better than indexing
    "C408",     # dict(...) in the make_job builder is deliberate and readable
]
